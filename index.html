<!-- @format -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <meta
      name="description"
      content="Portfolio of Marc Justine Aspa — full-stack developer building AI-powered web experiences with React, Node.js, and Python." />
    <meta name="author" content="Marc Justine Aspa" />

    <!-- Open Graph / Social Sharing -->
    <meta
      property="og:title"
      content="Marc Justine Aspa — Full-Stack Developer" />
    <meta
      property="og:description"
      content="Full-stack developer and AI enthusiast crafting elegant, polished web applications." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://your-portfolio-url.com" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Marc Justine Aspa — Full-Stack Developer Portfolio" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Marc Justine Aspa — Full-Stack Developer" />
    <meta
      name="twitter:description"
      content="Full-stack developer and AI enthusiast crafting elegant, polished web applications." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet" />

    <title>Marc Aspa</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
